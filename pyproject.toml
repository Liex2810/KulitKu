[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kulitku-monorepo"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]
[project.optional-dependencies]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.15,<2", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "matplotlib>=3.8,<4", "ImageHash>=4.3,<5", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.2,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.18,<1", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "onnxruntime>=1.20,<2", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "reportlab>=4.2,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=5,<7"]
[tool.setuptools.packages.find]
where = ["shared", "machine-learning/src", "backend"]
include = ["kulitku_core*", "kulitku_ml*", "app*"]
[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
